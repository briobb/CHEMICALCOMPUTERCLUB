<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CCCの8bitアクションゲーム CHANNEL ZERO。PCキーボード・USBゲームパッド対応。">
  <title>CHANNEL ZERO — Chemical Computer Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><a href="../" aria-label="CCCサイトへ戻る">CCC<span> SOFTWARE DIVISION</span></a><span class="edition">TIMBERFIELD, OR · EST. 1986</span></header>
    <section class="cabinet" aria-label="CHANNEL ZERO ゲーム">
      <div class="bezel-label"><span><i></i> CHANNEL ZERO</span><span>NTSC / 01</span></div>
      <div class="screen"><canvas id="game" width="384" height="288" tabindex="0" aria-label="CHANNEL ZERO。左右キーで移動、Zでジャンプと決定、Xでシグナルチューナー。"></canvas><div class="scanlines"></div></div>
      <div class="bezel-bottom"><span>CHEMICAL COMPUTER CLUB</span><span>● POWER</span></div>
    </section>
    <footer><div><span class="key">← →</span> イドウ <span class="key">Z / A</span> ジャンプ・ケッテイ <span class="key">X / B</span> TUNER</div><div class="tools"><button id="sound">SOUND ON</button><button id="fullscreen">FULLSCREEN ↗</button></div></footer>
    <p class="note" id="pad-status">KEYBOARD READY · USB GAMEPAD SUPPORTED</p>
  </main>
  <script src="js/config.js"></script><script src="js/stages.js"></script><script src="js/audio.js"></script><script src="js/art.js"></script><script src="js/story.js"></script><script src="js/game.js"></script>
</body>
</html>
