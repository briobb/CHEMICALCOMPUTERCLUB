<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101710">
  <title>ORBITAL | Chemical Computer Club</title>
  <link rel="stylesheet" href="/css/secret-network.css">
  <script src="/js/secret-network.js" defer></script>
</head>
<body>
  <main class="terminal">
    <div class="boot" aria-label="端末起動ログ">
      <div class="boot-log mono"><p>CCC NETWORK SYSTEM v1.86</p></div>
      <button class="skip" type="button" hidden>起動演出をスキップ <span aria-hidden="true">↵</span></button>
    </div>
    <header class="page-header">
      <h1 class="project mono">CCC / PROJECT ORBITAL</h1>
      <p class="mono sub">EST. 1986</p>
      <p class="verified">機密記録：008</p>
    </header>
    <p class="intro">座標データの復元が完了しました。</p>
    <section class="data-block" aria-labelledby="coordinates-title">
      <h2 class="data-label" id="coordinates-title">目的地座標</h2>
      <button class="coordinates mono" type="button" aria-label="目的地座標 34.4269095, 135.5117641 をコピー">
        <span>34.4269095° N</span><span>135.5117641° E</span>
      </button>
      <div class="data-meta"><span class="mono">WGS84</span><span>タップしてコピー</span></div>
      <p class="feedback" id="copy-status" role="status"></p>
    </section>
    <section class="data-block" aria-labelledby="target-title">
      <h2 class="data-label" id="target-title">探索対象</h2>
      <p class="target-number mono">57577</p>
    </section>
    <section class="message exploration" aria-label="探索メッセージ">
      <p>57577を探せ。</p><p>あとは、あなた次第だ。</p>
    </section>
    <div class="ending mono" lang="en"><p>THIS IS NOT THE END.</p><p>THIS IS WHERE IT BEGINS.</p></div>
    <footer class="terminal-footer">通信終了 <span class="cursor" aria-hidden="true">_</span></footer>
  </main>
</body>
</html>
