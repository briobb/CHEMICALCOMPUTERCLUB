<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101710">
  <title>RABBITHOLE | Chemical Computer Club</title>
  <link rel="stylesheet" href="/css/secret-network.css">
  <script src="/js/secret-network.js" defer></script>
</head>
<body>
  <main class="terminal">
    <div class="boot" aria-label="端末起動ログ">
      <div class="boot-log mono"><p>CCC NETWORK SYSTEM v1.86</p></div>
      <button class="skip" type="button" hidden>起動演出をスキップ <span aria-hidden="true">↵</span></button>
    </div>
    <header class="page-header">
      <h1 class="project mono">PROJECT / RABBITHOLE</h1>
      <p class="verified">暗号照合完了</p>
    </header>
    <section class="message" aria-label="受信メッセージ">
      <h2>おめでとう。</h2>
      <p>最初の暗号を解読したようだ。</p>
      <p>しかし、君はまだ本当のゴールにはたどり着いていない。</p>
      <p>もう一度、手元の会員証をよく見てほしい。</p>
      <p>そこには、真実へとつながるもうひとつの手がかりが隠されている。</p>
    </section>
    <p class="closing-note">すべての情報が、見たままとは限らない。</p>
    <footer class="terminal-footer">通信終了 <span class="cursor" aria-hidden="true">_</span></footer>
  </main>
</body>
</html>
